[platformio]
src_dir = firmware/src
include_dir = firmware/include
data_dir = firmware/data

# Mirror web/ into firmware/data/ before every build. The board
# serves the user-facing WebUI from the LittleFS image (data/);
# without this sync the build silently ships stale assets and the
# user sees a stale app.js / styles.css (we have shipped broken
# defaults at least twice this way).
extra_scripts = pre:scripts/sync_web_data.py

[env:esp32-s3-devkitc-1]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
  -DBOARD_HAS_PSRAM
lib_deps =
  https://github.com/esp32beans/switch_ESP32.git#0adba99d9c2b32c86aed21cb74558cc35841530e
  mathieucarbou/ESP Async WebServer @ ^3.0.6
build_unflags =
  -std=gnu++11
  -Werror
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DATT_CONTROL_SERIAL=Serial
